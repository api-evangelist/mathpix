    type: Documentation
  - url: openapi/mathpix-app-tokens-api-openapi.yml
    type: OpenAPI
  description: >-
    Mint short-lived client-side app_token credentials (30 seconds to 12 hours; 5 minutes by default)
    so browsers, mobile clients, and digital-ink surfaces can call Mathpix without exposing the long-lived
    app_key. Token issuance is free.
