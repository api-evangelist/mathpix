    type: Documentation
  - url: openapi/mathpix-strokes-api-openapi.yml
    type: OpenAPI
  - url: examples/mathpix-strokes-example.json
    type: Examples
  description: >-
    Recognize handwritten math, text, and chemistry from raw stroke coordinates (x/y arrays) via v3/strokes.
    Pairs with the App Tokens API and strokes_session_id for client-side digital-ink capture in browsers
    and tablets.
- aid: mathpix:mathpix-app-tokens-api
  name: Mathpix App Tokens API
  tags:
  - Authentication
  - Tokens
  - Security
  humanURL: https://docs.mathpix.com/reference/post-v3-app-tokens
