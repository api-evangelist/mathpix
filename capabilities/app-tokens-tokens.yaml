naftiko: 1.0.0-alpha2
info:
  label: Mathpix App Tokens API — Tokens
  description: 'Mathpix App Tokens API — Tokens. Mint short-lived client-side app_tokens. Self-contained
    Naftiko capability.'
  tags:
  - Mathpix
  - Authentication
  - Tokens
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    MATHPIX_APP_KEY: MATHPIX_APP_KEY
capability:
  consumes:
  - type: http
    namespace: app-tokens-tokens
    baseUri: https://api.mathpix.com
    resources:
    - name: v3-app-tokens
      path: /v3/app-tokens
      operations:
      - name: createapptoken
        method: POST
        description: Create An App Token
        outputRawFormat: json
        inputParameters:
        - name: body
          in: body
          type: object
          required: false
    authentication:
      type: apikey
      key: app_key
      value: '{{env.MATHPIX_APP_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: app-tokens-tokens-rest
    port: 8080
    resources:
    - path: /v1/v3/app-tokens
      name: v3-app-tokens
      operations:
      - method: POST
        name: createapptoken
        description: Create An App Token
        call: app-tokens-tokens.createapptoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: app-tokens-tokens-mcp
    port: 9090
    transport: http
    tools:
    - name: mathpix-create-app-token
      description: Create An App Token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: app-tokens-tokens.createapptoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
