naftiko: 1.0.0-alpha2
info:
  label: Mathpix Batch API — Batches
  description: 'Mathpix Batch API — Batches. Submit many images in one request and retrieve results
    keyed by caller IDs. Self-contained Naftiko capability.'
  tags:
  - Mathpix
  - Batch
  - OCR
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    MATHPIX_APP_ID: MATHPIX_APP_ID
    MATHPIX_APP_KEY: MATHPIX_APP_KEY
capability:
  consumes:
  - type: http
    namespace: batch-batches
    baseUri: https://api.mathpix.com
    resources:
    - name: v3-batch
      path: /v3/batch
      operations:
      - name: submitbatch
        method: POST
        description: Submit A Batch
        outputRawFormat: json
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: v3-batch-item
      path: /v3/batch/{batch_id}
      operations:
      - name: getbatchresults
        method: GET
        description: Get Batch Results
        outputRawFormat: json
        inputParameters:
        - name: batch_id
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: app_key
      value: '{{env.MATHPIX_APP_KEY}}'
      placement: header
      additionalHeaders:
        app_id: '{{env.MATHPIX_APP_ID}}'
  exposes:
  - type: rest
    namespace: batch-batches-rest
    port: 8080
    resources:
    - path: /v1/v3/batch
      name: v3-batch
      operations:
      - method: POST
        name: submitbatch
        description: Submit A Batch
        call: batch-batches.submitbatch
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: batch-batches-mcp
    port: 9090
    transport: http
    tools:
    - name: mathpix-submit-batch
      description: Submit A Batch
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: batch-batches.submitbatch
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: mathpix-get-batch-results
      description: Get Batch Results
      hints:
        readOnly: true
        idempotent: true
      call: batch-batches.getbatchresults
      with:
        batch_id: tools.batch_id
      outputParameters:
      - type: object
        mapping: $.
