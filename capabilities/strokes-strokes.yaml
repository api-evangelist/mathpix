naftiko: 1.0.0-alpha2
info:
  label: Mathpix Strokes API — Strokes
  description: 'Mathpix Strokes API — Strokes. Recognize handwriting from raw stroke coordinates.
    Self-contained Naftiko capability.'
  tags:
  - Mathpix
  - Strokes
  - Handwriting
  - Digital Ink
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    MATHPIX_APP_ID: MATHPIX_APP_ID
    MATHPIX_APP_KEY: MATHPIX_APP_KEY
capability:
  consumes:
  - type: http
    namespace: strokes-strokes
    baseUri: https://api.mathpix.com
    resources:
    - name: v3-strokes
      path: /v3/strokes
      operations:
      - name: processstrokes
        method: POST
        description: Process Strokes
        outputRawFormat: json
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    authentication:
      type: apikey
      key: app_key
      value: '{{env.MATHPIX_APP_KEY}}'
      placement: header
      additionalHeaders:
        app_id: '{{env.MATHPIX_APP_ID}}'
  exposes:
  - type: rest
    namespace: strokes-strokes-rest
    port: 8080
    resources:
    - path: /v1/v3/strokes
      name: v3-strokes
      operations:
      - method: POST
        name: processstrokes
        description: Process Strokes
        call: strokes-strokes.processstrokes
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: strokes-strokes-mcp
    port: 9090
    transport: http
    tools:
    - name: mathpix-process-strokes
      description: Process Strokes
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: strokes-strokes.processstrokes
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
