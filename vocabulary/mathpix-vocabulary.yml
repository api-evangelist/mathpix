vocabulary: Mathpix
version: '0.1'
created: '2026-05-25'
modified: '2026-05-25'
description: Operational and capability vocabulary for the Mathpix Convert API surface. Maps the
  provider's product language (Snip, MMD, SCS), API resources (text, pdf, converter, batch, strokes,
  app-tokens, ocr-usage), and STEM-domain output dimensions.
provider: Mathpix
providerId: mathpix
concepts:
  - id: mmd
    label: Mathpix Markdown (MMD)
    description: Superset of Markdown adding math equations, tables, and chemistry diagrams. Primary
      output format for all OCR endpoints.
  - id: stem-ocr
    label: STEM OCR
    description: Optical character recognition tuned for mathematical, scientific, and engineering
      content — equations, chemistry diagrams (SMILES), tables, handwriting.
  - id: digital-ink
    label: Digital Ink
    description: Real-time handwriting captured as stroke coordinates rather than rasterized images.
  - id: secure-conversion-service
    label: Secure Conversion Service (SCS)
    description: Mathpix's enterprise / on-premises deployment for high-volume document conversion.
  - id: snip
    label: Snip
    description: Mathpix's end-user product line (desktop snipping tool, mobile app, Chrome
      extension, collaborative MMD editor) built on the Convert API.
services:
  - id: image-ocr
    label: Image OCR
    api: /v3/text
    inputs: [image url, base64 image]
    outputs: [mmd, latex_styled, html, data, line_data, word_data]
  - id: document-ocr
    label: Document OCR
    api: /v3/pdf
    inputs: [document url, multipart upload]
    outputs: [mmd, md, docx, tex.zip, html, pptx, lines.json]
  - id: conversion
    label: Markdown Conversion
    api: /v3/converter
    inputs: [mmd]
    outputs: [docx, tex.zip, html, pdf, pptx, md, mmd.zip, md.zip, html.zip, latex.pdf]
  - id: batch-ocr
    label: Batch OCR
    api: /v3/batch
    inputs: [image url map]
    outputs: [per-key ocr result map]
  - id: strokes-ocr
    label: Strokes OCR
    api: /v3/strokes
    inputs: [stroke coordinates]
    outputs: [mmd, latex_styled, html, data]
  - id: app-tokens
    label: App Tokens
    api: /v3/app-tokens
    inputs: [app_key]
    outputs: [app_token, app_token_expires_at, strokes_session_id]
  - id: ocr-usage
    label: OCR Usage
    api: /v3/ocr-usage
    inputs: [from_date, to_date, group_by, timespan]
    outputs: [ocr_usage records]
tools:
  - id: mpxpy
    label: Mathpix Python SDK
    url: https://github.com/Mathpix/mpxpy
    language: Python
  - id: mpx-cli
    label: Mathpix CLI (mpx)
    url: https://github.com/Mathpix/mpx-cli
    language: JavaScript
  - id: ios-client
    label: Mathpix iOS Client
    url: https://github.com/Mathpix/ios-client
    language: Objective-C
  - id: mathpix-markdown-it
    label: mathpix-markdown-it
    url: https://github.com/Mathpix/mathpix-markdown-it
    description: Markdown-it renderer with MMD extensions (equations, tables, chemistry).
  - id: vscode-mathpix-markdown
    label: VS Code Extension for Mathpix Markdown
    url: https://github.com/Mathpix/vscode-mathpix-markdown
  - id: pdf-accessibility
    label: PDF Accessibility Toolkit
    url: https://github.com/Mathpix/PDF_Accessibility
    description: Remediation tool targeting WCAG 2.1 Level AA.
  - id: api-examples
    label: Mathpix API Examples
    url: https://github.com/Mathpix/api-examples
    language: Python
standards:
  - id: openapi-3-1-0
    label: OpenAPI 3.1.0
    notes: Used for all seven Mathpix OpenAPI specs in this catalog entry.
  - id: json-schema-2020-12
    label: JSON Schema (2020-12)
    notes: Used for image and document result schemas.
  - id: schema-org
    label: schema.org
    notes: Base vocabulary for the JSON-LD context.
  - id: latex
    label: LaTeX
    notes: Native target for math, equation, and tex.zip outputs.
  - id: smiles
    label: SMILES
    notes: Standard chemistry notation emitted by document OCR with include_smiles=true.
  - id: wcag-2-1
    label: WCAG 2.1 Level AA
    notes: Targeted by the open-source PDF_Accessibility tool.
  - id: focus-1-3
    label: FOCUS 1.3
    notes: FinOps cost-data spec used in finops/mathpix-finops.yml.
